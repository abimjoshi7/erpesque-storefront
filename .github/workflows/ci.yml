name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint

      # No ERP environment here on purpose: every tenant route is dynamic, so a
      # build that needs a live ERP would be a bug. `npm run types:check` is left
      # out because it regenerates from the ERP's OpenAPI spec, which lives in a
      # sibling checkout that CI does not have.
      - run: npm run build
