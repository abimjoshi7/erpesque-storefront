# Ports are shifted (5433 / 6380) so this stack can run beside the Erpesque
# Rust API's own Postgres on 5432 without a clash.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orderdesk
      POSTGRES_PASSWORD: orderdesk
      POSTGRES_DB: orderdesk
    ports:
      - "5433:5432"
    volumes:
      - orderdesk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderdesk -d orderdesk"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - orderdesk_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Phase 8 fills these in. Left commented so `pnpm db:up` works from day one.
